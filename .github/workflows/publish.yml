name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install exact dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Type-check
        run: npm run typecheck

      # Fail early if the pushed tag doesn't match the version being published —
      # catches a mistyped tag or a forgotten version bump before it hits npm.
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "package.json=$PKG_VERSION  tag=$TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Never publish a broken release.
      - name: Test
        run: npx jest

      - name: Build
        run: npm run build

      # 0.2.2 shipped with peerDependencies still pointing at a local tarball
      # path, so it resolved fine in the repo and was uninstallable everywhere
      # else. Pack it and install it into a clean project before publishing.
      - name: Install the packed tarball into a clean project
        run: |
          TARBALL=$(npm pack --silent)
          mkdir -p /tmp/install-check && cd /tmp/install-check
          npm init -y >/dev/null
          npm install react react-dom "$GITHUB_WORKSPACE/$TARBALL"
          node -e "require('@connectonion/react')"

      - name: Publish to npm
        run: npm publish --provenance --access public
