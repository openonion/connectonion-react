name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      # Fail early if the pushed tag doesn't match the version being published —
      # catches a mistyped tag or a forgotten version bump before it hits npm.
      # (Skipped for workflow_dispatch, which runs off a branch with no tag.)
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "package.json=$PKG_VERSION  tag=$TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Never publish a broken release.
      - name: Test
        run: npx jest

      - name: Build
        run: npm run build

      # 0.2.2 shipped with peerDependencies still pointing at a local tarball
      # path, so it resolved fine in the repo and was uninstallable everywhere
      # else. Pack it and install it into a clean project before publishing.
      - name: Install the packed tarball into a clean project
        run: |
          TARBALL=$(npm pack --silent)
          mkdir -p /tmp/install-check && cd /tmp/install-check
          npm init -y >/dev/null
          npm install react react-dom connectonion "$GITHUB_WORKSPACE/$TARBALL"
          node -e "require('@connectonion/react')"

      - name: Publish to npm
        run: npm publish --provenance --access public
